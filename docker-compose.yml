version: '3.8'

services:
  # Backend API
  viirs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viirs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent cache for NOAA tiles
      - viirs_cache:/tmp/viirs_cache
      # Optional: Mount backend for development
      # - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - viirs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'

  # Nginx for serving frontend + reverse proxy
  viirs-frontend:
    image: nginx:alpine
    container_name: viirs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - viirs-network
    depends_on:
      - viirs-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  viirs_cache:
    driver: local

networks:
  viirs-network:
    driver: bridge












